---
name: "star_index"
description: "Generate STAR genome index"
keywords:
  - index
  - genome
  - reference
  - star
  - rna-seq
tools:
  - "star":
      description: "Spliced Transcripts Alignment to a Reference"
      homepage: "https://github.com/alexdobin/STAR"
      documentation: "https://github.com/alexdobin/STAR/blob/master/doc/STARmanual.pdf"
      tool_dev_url: "https://github.com/alexdobin/STAR"
      doi: "10.1093/bioinformatics/bts635"
      licence: ["MIT"]
      identifier: biotools:star

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'genome' ]
    - fasta:
        type: file
        description: Reference genome FASTA file
        pattern: "*.{fa,fasta,fa.gz,fasta.gz}"
  - - meta2:
        type: map
        description: |
          Groovy Map containing annotation information
          e.g. [ id:'annotation' ]
    - gtf:
        type: file
        description: Gene annotation GTF file
        pattern: "*.{gtf,gtf.gz}"

output:
  - index:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'genome' ]
      - "star":
          type: directory
          description: STAR genome index directory
          pattern: "star"
  - versions:
      - "versions.yml":
          type: file
          description: File containing software versions
          pattern: "versions.yml"

authors:
  - "@Franzx7"
maintainers:
  - "@Franzx7"
